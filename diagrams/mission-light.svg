<text x="60" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="15" fill="#141414" text-anchor="start" >Bascule dans l'inauthentique : faux comptes à une étape, consigne de se dire électeur indépendant, centre caché.</text>
